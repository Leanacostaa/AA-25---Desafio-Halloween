<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación de Disfraces - Halloween</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #f1f1f1; padding: 20px; text-align: center; }
        h1 { color: #ff7518; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: #1e1e1e; border: 2px solid #ff7518; border-radius: 10px; padding: 20px; width: 280px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; color: #ffa500; }
        button { background: #ff7518; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #e05e0b; }
    </style>
</head>
<body>

    <h1>🎃 Votación de Disfraces de Halloween 🦇</h1>
    <div id="disfraces-container" class="container">Cargando disfraces...</div>

    <script>
        async function cargarDisfraces() {
            try {
                const response = await fetch('api/disfraces.php');
                const disfraces = await response.json();
                
                const container = document.getElementById('disfraces-container');
                container.innerHTML = '';

                if (disfraces.length === 0) {
                    container.innerHTML = '<p>No hay disfraces disponibles.</p>';
                    return;
                }

                disfraces.forEach(d => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${d.nombre}</h3>
                        <p>${d.descripcion}</p>
                        <p><strong>Votos: <span id="votos-${d.id}">${d.votos}</span></strong></p>
                        <button onclick="votar(${d.id})">¡Votar!</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error al cargar disfraces:', error);
            }
        }

        async function votar(id_disfraz) {
            try {
                const response = await fetch('api/disfraces.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_disfraz })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alert(data.mensaje);
                    cargarDisfraces(); // Recargar la lista para actualizar los contadores
                } else {
                    alert(data.error || 'Ocurrió un error al votar');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Cargar al iniciar la página
        cargarDisfraces();
    </script>

</body>
</html>
