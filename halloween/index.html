<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votación de Disfraces de Halloween</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }
        h1 {
            color: #ff6600;
        }
        /* Estilos para la barra de navegación superior */
        .nav-auth {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-auth {
            background: transparent;
            border: 2px solid #ff6600;
            color: #ff6600;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-auth:hover {
            background: #ff6600;
            color: white;
        }
        .contenedor-cards {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
        .card {
            border: 2px solid #ff6600;
            padding: 1.5rem;
            border-radius: 8px;
            width: 220px;
            background: #1a1a1a;
            text-align: center;
        }
        .card h3 {
            margin-top: 0;
            color: #ff9933;
        }
        button {
            background: #ff6600;
            border: none;
            padding: 0.6rem 1.2rem;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background: #e55b00;
        }
        #contenedor-top {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .podio-card {
            border: 2px solid #ffd700;
            padding: 1rem;
            border-radius: 8px;
            width: 180px;
            background: #1a1a1a;
        }
    </style>
</head>
<body>

    <!-- 🔗 Botones de Autenticación en la esquina superior derecha -->
    <div class="nav-auth">
    <a href="api/login.php" class="btn-auth">Iniciar Sesión</a>
    <a href="api/registro.php" class="btn-auth">Registrarse</a>
</div>

    <!-- 🏆 Sección Top 3 Más Votados -->
    <section>
        <h2>🏆 Top Disfraces Más Votados 🏆</h2>
        <div id="contenedor-top">
            <p>Cargando podio...</p>
        </div>
    </section>

    <hr style="border-color: #333; margin: 2rem 0;">

    <!-- 🎃 Lista General de Disfraces -->
    <h1>🎃 Votación de Disfraces de Halloween 🦇</h1>
    <div id="contenedor-disfraces" class="contenedor-cards">
        <p>Cargando disfraces...</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            cargarDatos();
        });

        function cargarDatos() {
            fetch('api/disfraces.php')
                .then(res => {
                    if (!res.ok) throw new Error("Error en la conexión con la API");
                    return res.json();
                })
                .then(disfraces => {
                    // 1. Renderizar el Top 3
                    const contenedorTop = document.getElementById('contenedor-top');
                    const masVotados = [...disfraces].sort((a, b) => b.votos - a.votos).slice(0, 3);
                    
                    contenedorTop.innerHTML = '';
                    masVotados.forEach((d, index) => {
                        const medalla = index === 0 ? '🥇' : (index === 1 ? '🥈' : '🥉');
                        contenedorTop.innerHTML += `
                            <div class="podio-card">
                                <h3>${medalla} ${d.nombre}</h3>
                                <p><strong>Votos:</strong> ${d.votos}</p>
                            </div>
                        `;
                    });

                    // 2. Renderizar la lista general completa
                    const contenedorDisfraces = document.getElementById('contenedor-disfraces');
                    contenedorDisfraces.innerHTML = '';
                    
                    disfraces.forEach(d => {
                        contenedorDisfraces.innerHTML += `
                            <div class="card">
                                <h3>${d.nombre}</h3>
                                <p>${d.descripcion}</p>
                                <p><strong>Votos: ${d.votos}</strong></p>
                                <button onclick="votar(${d.id})">¡Votar!</button>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Error:", err);
                    document.getElementById('contenedor-disfraces').innerHTML = '<p style="color: red;">Error al cargar los disfraces.</p>';
                });
        }

        function votar(disfrazId) {
            fetch('api/votar.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ disfraz_id: disfrazId })
            })
            .then(async res => {
                const data = await res.json();
                if (res.ok && data.success) {
                    alert(data.mensaje);
                    location.reload();
                } else {
                    alert(data.error || "Ocurrió un error al registrar el voto.");
                }
            })
            .catch(err => {
                console.error("Error en la petición de voto:", err);
                alert("Error de conexión al intentar votar.");
            });
        }
    </script>
</body>
</html>
